[extend]
useDefault = true
[[rules]]
id = "worksphere-api-key"
description = "WorkSphere bearer credential"
regex = '''ws_live_[A-Za-z0-9_-]{8}_[A-Za-z0-9_-]{43}'''
[[rules]]
id = "worksphere-file-kek"
description = "WorkSphere master encryption key"
regex = '''(?i)FILE_KEK\s*=\s*["']?([a-f0-9]{64})'''
secretGroup = 1
